<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Night Clerk Cans — Coming Soon</title>
<meta name="description" content="Night Clerk Cans. Quiet Hours, Every Hour. Coming soon.">
<meta property="og:title" content="Night Clerk Cans — Coming Soon">
<meta property="og:description" content="Quiet Hours, Every Hour. Coming soon.">
<meta property="og:type" content="website">
<meta property="og:image" content="assets/nightclerk-cans-logo.jpg">
<meta name="theme-color" content="#2b1a12">
<link rel="icon" type="image/png" href="assets/nightclerk-cans-logo-transparent.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --brown-950:#1d100a;
    --brown-900:#2b1a12;
    --cream:#f7ead0;
    --mustard:#f2c14e;
    --red:#c1272d;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
    background:var(--brown-950);
    color:var(--cream);
    overflow-x:hidden;
  }
  ::selection{background:var(--red);color:var(--cream)}
  a:focus-visible{outline:3px solid var(--mustard);outline-offset:3px;border-radius:999px}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

  /* ---------- Full-bleed door; logo mounted on it as the plaque ---------- */
  .door{
    position:relative;
    min-height:100dvh;
    overflow:hidden;
    isolation:isolate;
    background:var(--brown-950);
  }
  .plate{position:absolute;inset:0;z-index:0}
  .plate img{width:100%;height:100%;object-fit:cover;object-position:center;display:block}
  .door::after{ /* warm spill breathing over the lit edge */
    content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(50% 65% at 91% 42%, rgba(255,205,105,.18), transparent 62%);
    animation:spill 5.5s ease-in-out infinite;
  }
  @keyframes spill{0%,100%{opacity:.65}48%{opacity:1}52%{opacity:.78}56%{opacity:.95}}

  .plaque{
    position:absolute;z-index:2;
    left:6%;top:30%;
    width:min(44%,620px);
    filter:drop-shadow(0 22px 30px rgba(29,16,10,.38));
  }
  .plaque img{display:block;width:100%;height:auto}

  /* ---------- Socials / footer dock ---------- */
  .dock{
    position:absolute;left:50%;transform:translateX(-50%);
    bottom:20px;z-index:5;
    display:flex;flex-direction:column;align-items:center;gap:11px;
    width:max-content;max-width:calc(100vw - 28px);
  }
  .socials{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .socials a{
    display:inline-flex;align-items:center;gap:9px;
    min-height:44px;padding:10px 16px;border-radius:999px;
    border:1.5px solid rgba(247,234,208,.34);
    background:rgba(29,16,10,.82);color:var(--cream);
    text-decoration:none;font-weight:700;font-size:.92rem;letter-spacing:.02em;
    box-shadow:0 10px 24px rgba(29,16,10,.30);
    transition:background .18s ease,transform .18s ease,border-color .18s ease;
  }
  .socials a:hover{background:rgba(43,26,18,.96);border-color:rgba(242,193,78,.8);transform:translateY(-1px)}
  .socials svg{width:19px;height:19px;flex:none}
  .fineprint{
    margin:0;color:var(--cream);
    font-size:.76rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;
    text-shadow:0 1px 10px rgba(29,16,10,.9), 0 0 22px rgba(29,16,10,.65);text-align:center;
  }

  @media (max-width:820px){
    .plaque{
      left:50%;top:7%;transform:translateX(-50%);
      width:min(76vw,340px);
    }
    .dock{bottom:14px;width:calc(100vw - 24px)}
    .socials{gap:8px}
    .socials a{padding:9px 12px;font-size:.85rem;min-height:42px}
    .socials svg{width:17px;height:17px}
  }
  @media (prefers-reduced-motion:reduce){
    .door::after{animation:none}
    .socials a{transition:none}
  }
</style>
</head>
<body>
  <main class="door">
    <h1 class="sr-only">Night Clerk Cans — Coming Soon. Quiet Hours, Every Hour.</h1>

    <picture class="plate">
      <source media="(max-width: 820px)" srcset="assets/scene-door-mobile.jpg">
      <img src="assets/scene-door.jpg" width="1280" height="720"
           alt="Close-up of a motel door ajar with warm light spilling out, a brass knob with a red diamond room key, and a door hanger reading Coming Soon — Quiet Hours, Every Hour.">
    </picture>

    <div class="plaque">
      <img src="assets/nightclerk-logo-lockup.png" width="1024" height="635"
           alt="Night Clerk Cans — crow clerk holding a room key on a motel sign. Est. 2026.">
    </div>

    <div class="dock">
      <!-- TODO(owner): replace # with real Instagram / X / email URLs before sharing widely. -->
      <nav class="socials" aria-label="Follow Night Clerk Cans">
        <a href="#" aria-label="Night Clerk Cans on Instagram (link to be added)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="2.5" width="19" height="19" rx="5.5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r="1.1" fill="currentColor" stroke="none"/></svg>
          Instagram
        </a>
        <a href="#" aria-label="Night Clerk Cans on X (link to be added)">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.9 3H21l-6.78 7.74L22.5 21h-6.24l-4.89-6.38L5.8 21H2.66l7.25-8.28L2.1 3h6.4l4.42 5.83L17.9 3Zm-1.1 16.13h1.73L7.7 4.77H5.85L16.8 19.13Z"/></svg>
          X
        </a>
        <a href="mailto:" aria-label="Email Night Clerk Cans (address to be added)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="m3 7 9 6 9-6"/></svg>
          Email
        </a>
      </nav>
      <p class="fineprint">&copy; 2026 Night Clerk Cans</p>
    </div>
  </main>
</body>
</html>
